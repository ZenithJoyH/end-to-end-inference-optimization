operator_vs_e2e_analysis:
  status: completed_with_proven_and_inferred_causes_separated
  proven:
    - >-
      max_num_seqs changes the effective Decode M and graph from cached32 to
      cached64; a config tuned for M<=32 does not optimize M64.
    - >-
      The exact M64 profile made fused MoE 53.2 percent of rank0 Decode device
      activity, and an exact M64 GEMM2 improvement translated to +18.447 percent
      profiler-off service throughput.
    - >-
      Previous MoE-align and mHC candidates improved isolated operator timings
      but failed same-workload profiler-off service gates and were reverted.
  inferred_not_fully_proven_without_candidate_traces:
    - >-
      Event-synchronized microbenchmarks remove graph scheduling, overlap,
      dispatch, adjacent routing/padding, copy, reduction and synchronization
      costs; reducing one activity-duration therefore need not shorten the
      end-to-end critical path.
    - >-
      For mHC the reference activity total was nearly unchanged between max32
      and max64, and for MoE align its share was only about 7.7 percent at
      max32. Their isolated speedups could be offset by changed graph topology
      or neighboring costs, but no candidate trace exists to identify one
      exact offsetting component.
  decision_rule: >-
    Promote an operator result only after its live shape/config and graph path
    match the target service, then require a same-workload profiler-off service
    gain; microbenchmark speedup is screening evidence, not the final claim.
