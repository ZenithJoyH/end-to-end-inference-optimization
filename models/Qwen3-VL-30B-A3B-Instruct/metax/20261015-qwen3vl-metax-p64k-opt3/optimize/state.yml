- experiment_id: op-021-sampling-flaggems-dispatch
  status: refactored-on-disk-user-restart-pending
  optimization_layer: operator
  operator_strategy: replace
  objective: Move existing FlagGems-vllm sampling integration into Plugin FlagGems dispatch; retain kernel and MoE
    behavior
  primary_variable: Plugin sampling ownership/dispatch only
  user_instruction: '2026-10-19: sampling library integration belongs in FlagGems chain, not MetaX vendor patch;
    previous user instruction: user owns service restart and E2E run'
  design:
    entry: Common sampler patch from general plugin register_model; CachedOp apply_top_k_top_p
    default: default.flagos -> FlagGemsBackend -> existing root vendor-bound FlagGems-vllm API
    reference: reference.torch -> pre-existing native/platform filter captured by common shim; passed as native_filter
      to avoid recursion and preserve non-target backends
    metadata_fallback: Catch only pre-mutation NotImplementedError inside FlagGems adapter; unsupported shape must
      not globally blacklist default.flagos
    vendor: Restore MetaX original no-Triton PyTorch compatibility only; no direct FlagGems-vllm call in vendor
      patch
    controls: Existing VLLM_FL_USE_FLAGGEMS_VLLM/use_flaggems_op and dispatch policies; no new env; installer idempotent
    non_target: Preserve existing native/platform filter on disabled integration or reference; library controls
      hardware capability internally
